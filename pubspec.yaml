name: web_address_bar
description: Lets the mobile browser address bar collapse in full-page Flutter web apps on Android and iOS, while scrolling stays in Flutter's own scroll views.
version: 0.1.0
repository: https://github.com/koji-1009/web_address_bar
topics:
  - web
  - scroll
  - mobile
  - browser

environment:
  sdk: ^3.13.0
  flutter: ">=3.50.0-0.1.pre"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

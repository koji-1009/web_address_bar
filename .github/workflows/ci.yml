name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@158060745e545426c27a6e9814e5c5486a5f7dd8 # v1.4.2
      - run: dart format -o none --set-exit-if-changed .

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@158060745e545426c27a6e9814e5c5486a5f7dd8 # v1.4.2
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@158060745e545426c27a6e9814e5c5486a5f7dd8 # v1.4.2
      - name: Test (VM, the no-op implementation)
        run: flutter test
      - name: Test (Chrome, JavaScript)
        run: flutter test --platform chrome
      - name: Test (Chrome, WebAssembly)
        run: flutter test --platform chrome --wasm
      - name: Test the example
        working-directory: example
        run: flutter test --platform chrome
      - name: Build the example (JavaScript)
        working-directory: example
        run: flutter build web --profile
      - name: Build the example (WebAssembly)
        working-directory: example
        run: flutter build web --wasm

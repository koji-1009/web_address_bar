name: Pages

# Serves the example app at https://koji-1009.github.io/web_address_bar/, for
# trying the package on a phone. Built with Flutter master, which has the
# engine changes the package relies on for iOS (flutter/flutter#193744).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: koji-1009/setup-flutter@8602f8dee92d2365ed4d9af298572fbb38ab8c69 # v1.4.1
        with:
          channel: master
          # The release manifest has no master channel.
          git-source: git
          cache-sdk: false
          cache-pub: false

      # Works out the SDK's version from its git tags; without it, pub sees a
      # master SDK cloned from git as 0.0.0-unknown and rejects the package's
      # Flutter constraint.
      - run: flutter --version

      - name: Build the example
        working-directory: example
        run: flutter build web --base-href /web_address_bar/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: example/build/web

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="spacer" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff4e0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f0b860" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="590" fill="#ffffff"/>
  <line x1="400" y1="16" x2="400" y2="574" stroke="#ddd" stroke-width="1"/>

  <!-- ============ Android ============ -->
  <text x="24" y="30" font-size="16" font-weight="600" fill="#222">Android</text>
  <text x="24" y="52" font-size="13" fill="#333">&lt;html&gt;: scroll-snap-type: y mandatory</text>
  <text x="24" y="70" font-size="13" fill="#333">spacer: height 10000px, two snap targets</text>

  <!-- Spacer, axis broken twice -->
  <rect x="76" y="96" width="40" height="360" fill="url(#spacer)" stroke="#e08a00" stroke-width="2"/>
  <rect x="70" y="190" width="52" height="12" fill="#ffffff"/>
  <line x1="70" y1="194" x2="122" y2="186" stroke="#e08a00" stroke-width="2"/>
  <line x1="70" y1="206" x2="122" y2="198" stroke="#e08a00" stroke-width="2"/>
  <rect x="70" y="356" width="52" height="12" fill="#ffffff"/>
  <line x1="70" y1="360" x2="122" y2="352" stroke="#e08a00" stroke-width="2"/>
  <line x1="70" y1="372" x2="122" y2="364" stroke="#e08a00" stroke-width="2"/>
  <text x="96" y="475" text-anchor="middle" font-size="12" fill="#9a5a00">spacer</text>

  <!-- Ticks -->
  <text x="64" y="101" text-anchor="end" font-size="12" fill="#555">0</text>
  <text x="64" y="233" text-anchor="end" font-size="12" fill="#555">5000px</text>
  <text x="64" y="256" text-anchor="end" font-size="12" fill="#555">5001px</text>
  <text x="64" y="461" text-anchor="end" font-size="12" fill="#555">10000px</text>

  <!-- Snap targets at 5000px and 5001px (1px drawn as 8px) -->
  <line x1="70" y1="236" x2="246" y2="236" stroke="#e08a00" stroke-width="2"/>
  <circle cx="70" cy="236" r="3.5" fill="#e08a00"/>
  <line x1="70" y1="244" x2="246" y2="244" stroke="#e08a00" stroke-width="2"/>
  <circle cx="70" cy="244" r="3.5" fill="#e08a00"/>

  <!-- Viewport at rest on 5000px: bar shown -->
  <rect x="128" y="237" width="52" height="86" fill="#2f80ed" fill-opacity="0.18" stroke="#2f80ed" stroke-width="2"/>
  <text x="154" y="276" text-anchor="middle" font-size="12" fill="#1c5fb8">bar</text>
  <text x="154" y="292" text-anchor="middle" font-size="12" fill="#1c5fb8">shown</text>

  <!-- Viewport at rest on 5001px: bar hidden -->
  <rect x="188" y="245" width="52" height="100" fill="#2f80ed" fill-opacity="0.18" stroke="#2f80ed" stroke-width="2"/>
  <text x="214" y="290" text-anchor="middle" font-size="12" fill="#1c5fb8">bar</text>
  <text x="214" y="306" text-anchor="middle" font-size="12" fill="#1c5fb8">hidden</text>

  <!-- Distances to the edges -->
  <line x1="154" y1="230" x2="154" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="351" x2="214" y2="448" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bracket: what Chrome scrolls before it starts hiding the bar -->
  <line x1="254" y1="236" x2="254" y2="312" stroke="#555" stroke-width="1.5"/>
  <line x1="250" y1="236" x2="258" y2="236" stroke="#555" stroke-width="1.5"/>
  <line x1="250" y1="312" x2="258" y2="312" stroke="#555" stroke-width="1.5"/>

  <!-- Notes -->
  <text x="266" y="101" font-size="12" fill="#333">Top edge, about</text>
  <text x="266" y="117" font-size="12" fill="#333">5000px up: pull-to-</text>
  <text x="266" y="133" font-size="12" fill="#333">refresh out of reach</text>

  <text x="266" y="180" font-size="12" fill="#9a5a00">snap targets 1px</text>
  <text x="266" y="196" font-size="12" fill="#9a5a00">apart (scroll-snap-</text>
  <text x="266" y="212" font-size="12" fill="#9a5a00">align: start)</text>

  <text x="266" y="262" font-size="12" fill="#333">Chrome scrolls the</text>
  <text x="266" y="278" font-size="12" fill="#333">page about 130–180px</text>
  <text x="266" y="294" font-size="12" fill="#333">before it starts</text>
  <text x="266" y="310" font-size="12" fill="#333">hiding its bar, so the</text>
  <text x="266" y="326" font-size="12" fill="#333">range has to be long</text>

  <text x="266" y="398" font-size="12" fill="#333">Bottom edge, about</text>
  <text x="266" y="414" font-size="12" fill="#333">5000px down: out of</text>
  <text x="266" y="430" font-size="12" fill="#333">reach as well</text>

  <text x="24" y="506" font-size="12" fill="#333">Measured on a Pixel 9a with Chrome 155. Chrome shows the bar</text>
  <text x="24" y="522" font-size="12" fill="#333">again if the page moves back up after a scroll. A scroll comes</text>
  <text x="24" y="538" font-size="12" fill="#333">to rest on the snap target in the direction it went: on 5000px</text>
  <text x="24" y="554" font-size="12" fill="#333">with the bar shown, on 5001px with the bar hidden.</text>
  <text x="24" y="570" font-size="12" fill="#333">(Not to scale.)</text>

  <!-- ============ iOS ============ -->
  <text x="424" y="30" font-size="16" font-weight="600" fill="#222">iOS</text>
  <text x="424" y="52" font-size="13" fill="#333">&lt;html&gt;: scroll-snap-type: y mandatory</text>
  <text x="424" y="70" font-size="13" fill="#333">spacer: height 10000px, snap target at 5000px</text>

  <!-- Spacer, axis broken twice -->
  <rect x="490" y="96" width="40" height="360" fill="url(#spacer)" stroke="#e08a00" stroke-width="2"/>
  <rect x="484" y="190" width="52" height="12" fill="#ffffff"/>
  <line x1="484" y1="194" x2="536" y2="186" stroke="#e08a00" stroke-width="2"/>
  <line x1="484" y1="206" x2="536" y2="198" stroke="#e08a00" stroke-width="2"/>
  <rect x="484" y="356" width="52" height="12" fill="#ffffff"/>
  <line x1="484" y1="360" x2="536" y2="352" stroke="#e08a00" stroke-width="2"/>
  <line x1="484" y1="372" x2="536" y2="364" stroke="#e08a00" stroke-width="2"/>
  <text x="510" y="475" text-anchor="middle" font-size="12" fill="#9a5a00">spacer</text>

  <!-- Ticks -->
  <text x="480" y="101" text-anchor="end" font-size="12" fill="#555">0</text>
  <text x="480" y="245" text-anchor="end" font-size="12" fill="#555">5000px</text>
  <text x="480" y="461" text-anchor="end" font-size="12" fill="#555">10000px</text>

  <!-- Snap target at 5000px -->
  <line x1="484" y1="240" x2="612" y2="240" stroke="#e08a00" stroke-width="2"/>
  <circle cx="484" cy="240" r="3.5" fill="#e08a00"/>

  <!-- Viewport parked on it -->
  <rect x="548" y="241" width="56" height="100" fill="#2f80ed" fill-opacity="0.18" stroke="#2f80ed" stroke-width="2"/>
  <text x="576" y="295" text-anchor="middle" font-size="12" fill="#1c5fb8">viewport</text>

  <!-- Distances to the edges -->
  <line x1="576" y1="234" x2="576" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="576" y1="347" x2="576" y2="448" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <text x="620" y="101" font-size="12" fill="#333">Top edge, 5000px up:</text>
  <text x="620" y="117" font-size="12" fill="#333">pull-to-refresh and</text>
  <text x="620" y="133" font-size="12" fill="#333">rubber-banding out</text>
  <text x="620" y="149" font-size="12" fill="#333">of reach</text>

  <text x="620" y="236" font-size="12" fill="#9a5a00">snap target</text>
  <text x="620" y="252" font-size="12" fill="#9a5a00">(scroll-snap-align:</text>
  <text x="620" y="268" font-size="12" fill="#9a5a00">start): the viewport</text>
  <text x="620" y="284" font-size="12" fill="#9a5a00">is parked on it</text>

  <text x="620" y="398" font-size="12" fill="#333">Bottom edge, 5000px</text>
  <text x="620" y="414" font-size="12" fill="#333">below the snap target:</text>
  <text x="620" y="430" font-size="12" fill="#333">out of reach as well</text>

  <text x="424" y="506" font-size="12" fill="#333">mandatory: a scroll always comes to rest on the snap target</text>
  <text x="424" y="522" font-size="12" fill="#333">again, which cuts Safari's momentum scrolling short.</text>
  <text x="424" y="538" font-size="12" fill="#333">overscroll-behavior does not prevent pull-to-refresh and</text>
  <text x="424" y="554" font-size="12" fill="#333">rubber-banding there. (Not to scale.)</text>
</svg>
